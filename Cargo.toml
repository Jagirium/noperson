[package]
name = "noperson"
version = "0.1.0"
edition = "2024"
description = "Open-source GPU-accelerated face swap — pure Rust, ort + CUDA"
license = "AGPL-3.0"

[lib]
name = "noperson"
crate-type = ["rlib"]

[[bin]]
name = "noperson"
path = "src/main.rs"

[dependencies]
# ── ML inference — ONNX Runtime with CUDA EP ────────────────────────
# Cross-platform: Linux/macOS/Windows. CUDA EP for NVIDIA GPUs.
# download-binaries: auto-downloads libonnxruntime, copy-dylibs: puts .so next to binary.
ort = { version = "=2.0.0-rc.12", features = ["cuda", "tensorrt", "download-binaries", "copy-dylibs"] }
ort-sys = "=2.0.0-rc.12"

# ── GPU compute — cudarc (CUDA driver API, PTX kernels) ─────────────
# Used for image ops: warp, resize, normalize, mask, blur, paste-back.
cudarc = { version = "0.19.4", features = ["cuda-12080"] }
libloading = "0.9"
fs2 = "0.4"
tar = "0.4"
zstd = "0.13"

# ── Image I/O ───────────────────────────────────────────────────────
image = { version = "0.25", features = ["jpeg", "png", "bmp", "webp"] }

# ── GUI — pure Rust immediate mode ──────────────────────────────────
eframe = "0.35.0"
egui = "0.35.0"
egui-wgpu = "0.35.0"
egui_extras = { version = "0.35.0", features = ["image"] }
elegance = { package = "egui-elegance", version = "0.14.0" }

# ── Native file dialog ──────────────────────────────────────────────
rfd = "0.17.2"

# ── Serialization ───────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Error handling ─────────────────────────────────────────────────
anyhow = "1"
thiserror = "2"

# ── Logging ────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Math (affine estimation on CPU — 5 points, too small for GPU) ──
nalgebra = "0.34"

# ── Byte casting ───────────────────────────────────────────────────
bytemuck = { version = "1", features = ["derive"] }

# ── Hashing (parallel model integrity verification) ─────────────────
blake3 = { version = "1", features = ["rayon"] }

# ── Resumable model delivery ────────────────────────────────────────
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

# ── Lock-free engine generation reads ──────────────────────────────
arc-swap = "1.7"
indicatif = "0.18.6"

# ── Platform I/O ────────────────────────────────────────────────────
[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-v4l"] }
virtualcam = { version = "1.0.0", default-features = false, features = ["v4l2"] }
ash = "0.38"
wgpu = { version = "29.0.4", features = ["vulkan"] }
wgpu-hal = { version = "29.0.4", features = ["vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-msmf"] }
virtualcam = { version = "1.0.0", default-features = false, features = ["media-foundation", "obs", "gpu"] }

[features]
default = []

[dev-dependencies]
egui_kittest = { version = "0.35.0", features = ["snapshot", "wgpu"] }
tempfile = "3"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = true
strip = true
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = 2
strip = false
panic = "unwind"
incremental = false

# Keep local builds small. Full debug symbols and incremental caches multiply
# the size of every GUI/test binary and previously grew target/debug past 100 GiB.
[profile.dev]
debug = 0
incremental = false
codegen-units = 2
strip = "debuginfo"

[profile.test]
debug = 0
incremental = false
codegen-units = 2
strip = "debuginfo"
